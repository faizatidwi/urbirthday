<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
overflow-x:hidden;
min-height:100vh;
color:white;
}

/* Bintang */

.star{
position:fixed;
color:white;
opacity:.4;
animation:blink 2s infinite;
pointer-events:none;
z-index:1;
}

@keyframes blink{
50%{
opacity:1;
}
}

/* Card */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.2);
padding:40px;
border-radius:30px;
text-align:center;
width:90%;
max-width:600px;
box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.gift{
font-size:120px;
animation:floatGift 2s ease-in-out infinite;
}

@keyframes floatGift{
50%{
transform:translateY(-10px);
}
}

.card h1{
margin-top:15px;
}

.card p{
margin-top:10px;
opacity:.9;
}

.btn{
padding:14px 30px;
border:none;
border-radius:50px;
background:white;
color:#764ba2;
font-weight:600;
cursor:pointer;
margin:8px;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

/* Popup */

.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
backdrop-filter:blur(5px);
justify-content:center;
align-items:center;
z-index:999;
}

.popup-content{
background:white;
color:#333;
padding:35px;
border-radius:25px;
width:90%;
max-width:500px;
text-align:center;
animation:pop .4s ease;
}

@keyframes pop{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

.popup-icon{
font-size:80px;
margin-bottom:10px;
}

.popup-btn{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:25px;
background:#764ba2;
color:white;
cursor:pointer;
}

.close{
float:right;
font-size:30px;
cursor:pointer;
}

/* Content */

.content{
display:none;
padding:40px 20px;
}

.section{
max-width:900px;
margin:auto;
background:white;
color:#333;
padding:40px;
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,.15);
}

.typing{
white-space:pre-line;
line-height:2;
font-size:1.1rem;
}

.final-message{
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:none;
}
}

.footer{
text-align:center;
padding:60px 20px;
font-size:2rem;
}

/* Balon */

.balloon{
position:fixed;
bottom:-100px;
font-size:40px;
pointer-events:none;
animation:fly linear forwards;
z-index:2;
}

@keyframes fly{
to{
transform:translateY(-120vh);
}
}

/* Confetti */

.confetti{
position:fixed;
width:10px;
height:10px;
top:-20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

@media(max-width:768px){

.gift{
font-size:90px;
}

.card{
padding:25px;
}

.section{
padding:25px;
}

}

</style>
</head>

<body>

<audio id="music" loop>
<source src="payphone.mp3.mp3" type="audio/mpeg">
</audio>

<section class="hero">

<div class="card">

<div class="gift">🎁</div>

<h1>Seseorang Mengirim Ucapan Untukmu</h1>

<p>
Ada sesuatu yang spesial menunggumu hari ini ✨
</p>

<br>

<button class="btn" onclick="openGift()">
Buka Hadiah
</button>

</div>

</section>

<div id="popup" class="popup">

<div class="popup-content">

<div class="close" onclick="closePopup()">
×
</div>

<div class="popup-icon">
🎂
</div>

<h2>Happy Birthday 🎉</h2>

<p>
Semoga hari ini penuh kebahagiaan,
tawa, dan hal-hal indah ❤️
</p>

<button class="popup-btn"
onclick="showMessage()">
Baca Pesan
</button>

</div>

</div>

<div id="content" class="content">

<div class="section">

<h2 style="text-align:center;">
🎁 Ada 5 Ucapan Untukmu
</h2>

<p style="text-align:center;margin-top:10px;">
Buka satu per satu ya ✨
</p>

<br>

<div id="messageBox" class="typing">
Klik berurutan dari 1 untuk memulai 💝
</div>

<br><br>

<div style="text-align:center;">

<button id="btn1" class="btn" onclick="showStep(1)">🎁 Ucapan 1</button>

<button id="btn2" class="btn" onclick="showStep(2)" disabled>🎀 Ucapan 2</button>

<button id="btn3" class="btn" onclick="showStep(3)" disabled>💖 Ucapan 3</button>

<button id="btn4" class="btn" onclick="showStep(4)" disabled>🌟 Ucapan 4</button>

<button id="btn5" class="btn" onclick="showStep(5)" disabled>🎂 Ucapan Terakhir</button>

</div>

</div>

<div class="footer">
🎈 Happy Birthday 🎈
</div>

</div>

<script>

/* Bintang */

for(let i=0;i<100;i++){

const star=document.createElement("div");

star.className="star";
star.innerHTML="✦";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

/* Balon */

function createBalloon(){

const balloon=document.createElement("div");

balloon.className="balloon";

const emoji=["🎈","🎉","🎊","✨","🎂"];

balloon.innerHTML=
emoji[Math.floor(Math.random()*emoji.length)];

balloon.style.left=
Math.random()*100+"vw";

balloon.style.animationDuration=
(6+Math.random()*5)+"s";

document.body.appendChild(balloon);

setTimeout(()=>{
balloon.remove();
},12000);

}

setInterval(createBalloon,800);

/* Popup */

function openGift(){

document.getElementById("popup")
.style.display="flex";

launchConfetti();

}

function closePopup(){

document.getElementById("popup")
.style.display="none";

}

/* Masuk ke pesan */

function showMessage(){

document.getElementById("popup")
.style.display="none";

document.querySelector(".hero")
.style.display="none";

document.getElementById("content")
.style.display="block";

document.getElementById("music")
.play()
.catch(()=>{});

}

/* Hadiah */

function showStep(step){

const box =
document.getElementById("messageBox");

switch(step){

case 1:

launchConfetti();

box.innerHTML=`
🎁 UCAPAN PERTAMA

Hari ini adalah hari spesialmu.

Bukan hanya hari ini namun setiap waktu semoga penuh tawa
dan kebahagiaan 😊
`;

document.getElementById("btn2").disabled=false;

break;

case 2:

launchConfetti();

box.innerHTML=`
🎀 UCAPAN KEDUA

Terima kasih sudah menjadi
pribadi yang baik, perhatian dan hangat ✨
`;

document.getElementById("btn3").disabled=false;

break;

case 3:

launchConfetti();

box.innerHTML=`
💖 UCAPAN KETIGA

Jangan pernah meragukan
dirimu sendiri.

Kamu luar biasa ❤️
`;

document.getElementById("btn4").disabled=false;

break;

case 4:

launchConfetti();

box.innerHTML=`
🌟 UCAPAN KEEMPAT

Semoga semua impianmu
pelan-pelan menjadi nyata 🍀
`;

document.getElementById("btn5").disabled=false;

break;

case 5:

launchConfetti();

box.innerHTML=`
<div class="final-message">

🎂 SELAMAT ULANG TAHUN 🎂

Semoga kesehatan,
kebahagiaan,
kesuksesan,
dan keberuntungan
selalu menyertaimu.

Aku memang baru saja hadir dalam hidupmu
mengubah atau tidaknya itu bukan takdir 
namun itu darimu dan diriku

semoga keinginan, harapan ataupun impianmu
terwujud namun jangan lupa usaha dan doa

itu aja yahh paiipaii
lovvv

✨ Happy Birthday ✨

❤️❤️❤️

</div>
`;

document.getElementById("btn1").disabled=true;
document.getElementById("btn2").disabled=true;
document.getElementById("btn3").disabled=true;
document.getElementById("btn4").disabled=true;
document.getElementById("btn5").disabled=true;

break;

}

}

/* Confetti */

function launchConfetti(){

for(let i=0;i<120;i++){

const conf=
document.createElement("div");

conf.className="confetti";

conf.style.left=
Math.random()*100+"vw";

conf.style.animationDuration=
(3+Math.random()*4)+"s";

conf.style.background=
`hsl(${Math.random()*360},90%,60%)`;

document.body.appendChild(conf);

setTimeout(()=>{
conf.remove();
},7000);

}

}

</script>

</body>
</html>
